<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12313B">
  <title>João Pedro · Desenvolvedor Júnior</title>
  <meta name="description" content="Portfólio e currículo de João Pedro Carneiro Santana, desenvolvedor júnior em Brasília, DF.">
  <meta property="og:title" content="João Pedro · Desenvolvedor Júnior">
  <meta property="og:description" content="Projetos, skills, formação e certificados. Currículo em PDF.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11.5 9 16.5A9 9 0 0 1 7 19.5C7 14.5 11 10 16 3z' fill='%232F6F7E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/purify.min.js"></script>
</head>
<body>
  <div class="layout">
    <!-- Coluna lateral: apresentação, menu, PDF e redes. A chuva é desenhada no canvas. -->
    <aside class="side" aria-label="Apresentação">
      <canvas id="rain" aria-hidden="true"></canvas>
      <div class="side-in" id="side"></div>
    </aside>

    <main id="main">
      <!-- Caixa de postagem: só aparece no modo admin (é movida para a seção Novidades) -->
      <section id="composer" class="comp" hidden>
        <div class="ed-wrap">
          <div id="editor" class="editor" contenteditable="true" data-ph="Escreva uma novidade..."></div>
          <div id="compAtt" class="att-list"></div>
        </div>
        <div class="tools">
          <div class="fmt" id="fmtBar">
            <button data-cmd="styles" title="Estilos">Aa</button>
            <button data-cmd="bold" title="Negrito"><b>B</b></button>
            <button data-cmd="italic" title="Itálico"><i>I</i></button>
            <button data-cmd="underline" title="Sublinhado"><u>U</u></button>
            <button data-cmd="strikeThrough" title="Riscado"><s>S</s></button>
            <button data-cmd="insertUnorderedList" title="Lista">☰</button>
            <button data-cmd="insertOrderedList" title="Lista numerada">1.</button>
            <button data-cmd="checklist" title="Checklist">☑︎</button>
          </div>
          <div class="fmt styles" id="stylesBar" hidden>
            <button data-block="h2">Título</button>
            <button data-block="h3">Subtítulo</button>
            <button data-block="p">Corpo</button>
            <button data-cmd="removeFormat">Limpar</button>
          </div>
          <div class="att">
            <label class="soft">Imagem<input type="file" id="pickImg" accept="image/*" multiple hidden></label>
            <label class="soft">Arquivo<input type="file" id="pickFile" multiple hidden></label>
            <button class="soft" id="cancelEdit" hidden>Cancelar</button>
            <button class="primary" id="publish">Publicar</button>
          </div>
        </div>
      </section>

      <div id="view"></div>
    </main>
  </div>

  <div class="mobile-bar" id="mobileBar"></div>
  <button id="adminPill" class="pill" hidden>Modo admin · Sair</button>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
